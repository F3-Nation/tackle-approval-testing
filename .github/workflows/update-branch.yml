name: update-branch
# Presses "Update branch" as github-actions[bot], the same account that approves.
on:
  workflow_dispatch:
    inputs:
      pr:
        required: true
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - run: gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$PR/update-branch"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
